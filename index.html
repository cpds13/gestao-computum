<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#172B46" />
  <meta name="description" content="Gestão Computum — controle de solicitações, cálculos judiciais, retrabalhos e financeiro." />
  <title>Gestão Computum</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="appShell" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark"><span></span></div>
        <div>
          <strong>COMPUTUM</strong>
          <small>Gestão de Cálculos</small>
        </div>
      </div>

      <nav class="nav" aria-label="Navegação principal">
        <button class="nav-item active" data-view="dashboard"><span>⌂</span> Dashboard</button>
        <button class="nav-item" data-view="solicitacoes"><span>▣</span> Solicitações</button>
        <button class="nav-item" data-view="advogados"><span>♙</span> Advogados</button>
        <button class="nav-item" data-view="clientes"><span>♧</span> Clientes</button>
        <button class="nav-item" data-view="processos"><span>§</span> Processos</button>
        <button class="nav-item" data-view="calculistas"><span>∑</span> Calculistas</button>
        <button class="nav-item" data-view="financeiro"><span>R$</span> Financeiro</button>
        <button class="nav-item" data-view="relatorios"><span>◫</span> Relatórios</button>
      </nav>

      <div class="sidebar-bottom">
        <button class="nav-item" data-view="configuracoes"><span>⚙</span> Configurações</button>
        <div class="user-mini">
          <div class="avatar">P</div>
          <div><strong>Patrick</strong><small>Administrador</small></div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-button mobile-only" id="menuBtn" aria-label="Abrir menu">☰</button>
        <div class="breadcrumb" id="breadcrumb">Dashboard</div>
        <div class="top-actions">
          <button class="icon-button" title="Notificações">♢<i class="notification-dot"></i></button>
          <button class="profile-button" id="profileBtn"><span class="avatar small">P</span><span class="desktop-only">Patrick</span>⌄</button>
        </div>
      </header>

      <div id="content" class="content"></div>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <div id="modalRoot"></div>
  <div id="drawerRoot"></div>

  <script src="app.js"></script>
</body>
</html>
